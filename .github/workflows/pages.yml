name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - CHANGELOG.md
      - docs/public/**
      - .github/workflows/pages.yml
  workflow_dispatch:

jobs:
  docs:
    # Must be granted here, not inside build-docs.yml itself — a reusable
    # workflow can't self-grant pages/id-token when called cross-repo.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ohstr/docs-kit/.github/workflows/build-docs.yml@main
    with:
      title: ncash
      description: A wallet CLI for NIP-CASH cash tokens and NIP-CW circle wallets.
      accent-hue: 142 # money green
      favicon-glyph: "$"
      extra-public-dir: docs/public # install.sh, install.ps1, PROMPT.md
